name: Create search index

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [jekyll-wave]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  jekyll:
    runs-on: RAM32GB
    timeout-minutes: 90
    environment: jekyll
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: ruby/setup-ruby@3fee6763234110473bd57dd4595c5199fce2c510 # v1.258.0, Node 20; RAM32GB cannot run node24 on @v1
        with:
          ruby-version: 2.7
          working-directory: docs
          bundler-cache: true
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: create_search_index.yml
          workflow_conclusion: success
          name: jekyll-build
          path: docs
          if_no_artifact_found: ignore
      - name: Extract artifacts
        id: restore-build-cache
        working-directory: docs
        run: bash _scripts/restore_jekyll_cache.sh
      - name: Build one wave
        id: jekyll-waves
        env:
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_ACCESS_TOKEN: ${{ secrets.ELASTICSEARCH_ACCESS_TOKEN }}
          ELASTICSEARCH_INDEX_NAME: ${{ secrets.ELASTICSEARCH_INDEX_NAME }}
          SEARCH_ORIGIN: ${{ secrets.SEARCH_ORIGIN }}
          ORIGIN: ${{ secrets.ORIGIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MODELS_PUBLIC_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MODELS_SECRET_KEY }}
          JEKYLL_POST_BATCH: "10000"
          FULL_BUILD: "1"
        working-directory: docs
        run: |
          set -euo pipefail
          echo "jekyll_wave_complete=false" >> "$GITHUB_OUTPUT"
          echo "Starting Jekyll wave"
          bundle exec jekyll build --incremental
      - name: Zip wave checkpoint
        if: always()
        run: bash docs/_scripts/zip_jekyll_checkpoint.sh
      - name: Upload wave checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-build
          path: ./jekyll-content.zip
          overwrite: true
      - name: Dispatch next wave
        if: steps.jekyll-waves.outputs.jekyll_wave_complete != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: jekyll-wave
      - uses: actions/setup-node@v4
        if: ${{ steps.jekyll-waves.outputs.jekyll_wave_complete == 'true' }}
        with:
          node-version: 16
          cache: yarn
          cache-dependency-path: docs/_frontend/yarn.lock
      - name: Build frontend
        if: ${{ steps.jekyll-waves.outputs.jekyll_wave_complete == 'true' }}
        working-directory: docs/_frontend
        env:
          SEARCH_ORIGIN: ${{ secrets.SEARCH_ORIGIN }}
          ORIGIN: ${{ secrets.ORIGIN }}
        run: |
          yarn
          yarn run build
          mv static ../_site/
      - name: Deploy to GitHub Pages
        if: ${{ steps.jekyll-waves.outputs.jekyll_wave_complete == 'true' }}
        uses: peaceiris/actions-gh-pages@47f197a2200bb9de68ba5f48fad1c088eb1c4a32 # v4.0.0, Node 20; v4 tag is node24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_site
