name: Create search index

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Make sure only workflow run at a time for create_search_index.yml
  group: ${{ github.workflow }}

jobs:
  jekyll:
    runs-on: RAM32GB
    timeout-minutes: 600
    environment: jekyll
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 20
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
          working-directory: docs
          bundler-cache: true
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: create_search_index.yml
          workflow_conclusion: success
          name: jekyll-build
          path: docs
          if_no_artifact_found: ignore
      - name: Extract artifacts
        id: restore-build-cache
        working-directory: docs
        run: bash _scripts/restore_jekyll_cache.sh
      - name: Build in waves
        id: jekyll-waves
        env:
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_ACCESS_TOKEN: ${{ secrets.ELASTICSEARCH_ACCESS_TOKEN }}
          ELASTICSEARCH_INDEX_NAME: ${{ secrets.ELASTICSEARCH_INDEX_NAME }}
          SEARCH_ORIGIN: ${{ secrets.SEARCH_ORIGIN }}
          ORIGIN: ${{ secrets.ORIGIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MODELS_PUBLIC_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MODELS_SECRET_KEY }}
          JEKYLL_POST_BATCH: "10000"
          FULL_BUILD: "1"
        working-directory: docs
        run: |
          set -euo pipefail
          echo "jekyll_wave_complete=false" >> "$GITHUB_OUTPUT"
          for wave in $(seq 1 20); do
            echo "Starting Jekyll wave ${wave}"
            bundle exec jekyll build --incremental
            if grep -q '^jekyll_wave_complete=true$' "$GITHUB_OUTPUT"; then
              echo "Jekyll corpus complete after wave ${wave}"
              break
            fi
          done
      - uses: actions/setup-node@v3
        if: ${{ steps.jekyll-waves.outputs.jekyll_wave_complete == 'true' }}
        with:
          node-version: 16
          cache: yarn
          cache-dependency-path: docs/_frontend/yarn.lock
      - name: Build frontend
        if: ${{ steps.jekyll-waves.outputs.jekyll_wave_complete == 'true' }}
        working-directory: docs/_frontend
        env:
          SEARCH_ORIGIN: ${{ secrets.SEARCH_ORIGIN }}
          ORIGIN: ${{ secrets.ORIGIN }}
        run: |
          yarn
          yarn run build
          mv static ../_site/
      - name: Deploy to GitHub Pages
        if: ${{ steps.jekyll-waves.outputs.jekyll_wave_complete == 'true' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_site
      - name: Zip contents for artifacts
        run: |
          7z a -tzip jekyll-content.zip \
            ./docs/_site/* \
            ./docs/.jekyll-metadata \
            ./docs/backup-models.json \
            ./docs/backup-benchmarking.json \
            ./docs/backup-references.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-build
          path: |
            ./jekyll-content.zip
