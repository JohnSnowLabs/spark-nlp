name: build

on:
  push:
    paths-ignore:
      - "docs/**"
      - "conda/**"
      - "scripts/**"
      - "examples/**"
      - "**.md"
      - "**.ipynb"
    branches:
      - "master"
      - "*release*"
      - "release/**"
      - "main"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "conda/**"
      - "scripts/**"
      - "examples/**"
      - "**.md"
      - "**.ipynb"
    branches:
      - "master"
      - "*release*"
      - "release/**"
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TF_CPP_MIN_LOG_LEVEL: 3
  JAVA_OPTS: "-Xmx4096m -XX:+UseG1GC"

jobs:
  # Builds the assembly jar and runs the Scala suite, exactly as before, but now
  # also publishes the jar as an artifact. Keeping the build and the Scala tests
  # in one job avoids recompiling the project twice; the win comes from the
  # Python jobs below, which no longer build anything at all.
  build:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip test]')"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.3"
            sbt_flag: is_spark33
            coverage: false
          - spark: "3.4"
            sbt_flag: is_spark34
            coverage: true
          - spark: "3.5"
            sbt_flag: is_spark35
            coverage: false
    name: Build and Test on Apache Spark ${{ matrix.spark }}.x

    steps:
      - uses: actions/checkout@v4
      - name: Setup openjdk Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH
          java -version
      - uses: sbt/setup-sbt@v1
        with:
          disk-cache: false
      - name: Build Spark NLP on Apache Spark ${{ matrix.spark }}.x
        run: sbt -mem 4096 -D${{ matrix.sbt_flag }}=true clean assemblyAndCopy
      # copyAssembledJar (build.sbt) writes the assembly to python/lib/sparknlp.jar.
      # The jar is compiled against a specific spark-core, so it is keyed by Spark
      # version and must never be shared between them.
      - name: Upload assembled jar
        uses: actions/upload-artifact@v4
        with:
          name: sparknlp-jar-spark${{ matrix.spark }}
          path: python/lib/sparknlp.jar
          retention-days: 1
          if-no-files-found: error
      - name: Test Spark NLP in Scala - Apache Spark ${{ matrix.spark }}.x
        if: ${{ ! matrix.coverage }}
        run: sbt -mem 4096 test
      - name: Test Spark NLP in Scala with coverage - Apache Spark ${{ matrix.spark }}.x
        if: ${{ matrix.coverage }}
        run: sbt -mem 4096 coverage test
      - name: Upload coverage data to Coveralls
        if: ${{ matrix.coverage }}
        run: sbt coverageReport coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: Apache Spark ${{ matrix.spark }}.x - Scala 2.12

  # Sparse on purpose: several (Spark, Python) pairs are impossible upstream.
  # PySpark 3.3 does not support Python 3.11, and PySpark 3.4 does not support
  # 3.12. Only combinations PySpark itself supports are listed here.
  # Adding a Python version is now a single matrix entry.
  python-test:
    needs: build
    if: "! contains(toJSON(github.event.commits.*.message), '[skip test]')"
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor. Keep green - this is the backward-compatibility gate.
          - spark: "3.3"
            pyspark: 3.3.1
            python: "3.8"
          - spark: "3.3"
            pyspark: 3.3.1
            python: "3.10"
          - spark: "3.4"
            pyspark: 3.4.1
            python: "3.8"
          - spark: "3.4"
            pyspark: 3.4.1
            python: "3.11"
          - spark: "3.5"
            pyspark: 3.5.4
            python: "3.9"
          - spark: "3.5"
            pyspark: 3.5.4
            python: "3.11"
          - spark: "3.5"
            pyspark: 3.5.4
            python: "3.12"
    name: Python ${{ matrix.python }} (Spark ${{ matrix.spark }}.x)

    steps:
      - uses: actions/checkout@v4
      - name: Setup openjdk Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH
          java -version
      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          # setuptools mirrors the marker-gated dependency in pyproject.toml: it
          # supplies the distutils shim that PySpark 3.5 still needs on 3.12.
          # These tests run against the source tree, so it is installed here
          # rather than being pulled in by the wheel's metadata.
          pip install setuptools
          pip install pyspark==${{ matrix.pyspark }} numpy pytest
      - name: Download assembled jar
        uses: actions/download-artifact@v4
        with:
          name: sparknlp-jar-spark${{ matrix.spark }}
          path: python/lib
      - name: Test Spark NLP in Python - Apache Spark ${{ matrix.spark }}.x
        run: |
          cd python
          python -m pytest -v -m fast

  packaging:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip test]')"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    name: Packaging (Python ${{ matrix.python }})

    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          cd python
          python -m build
          python -m twine check dist/*
      - name: Check wheel tag, requires-python and contents
        run: |
          cd python
          ls dist/
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")
          assert len(whl) == 1, whl
          whl = whl[0]
          assert whl.endswith("-py3-none-any.whl"), f"expected a py3-only wheel, got {whl}"
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              meta = z.read([n for n in names if n.endswith("METADATA")][0]).decode()
          assert "Requires-Python: >=3.8" in meta, "requires-python missing or wrong"
          stray = [n for n in names if n.startswith(("tensorflow/", "test/", "lib/", "docs/"))]
          assert not stray, f"unexpected paths in wheel: {stray}"
          print("wheel metadata OK:", whl)
          EOF
      # A 3.12 env ships neither setuptools nor distutils. PySpark 3.5 still
      # imports distutils, so the marker-gated setuptools dependency is what
      # keeps `pip install spark-nlp` usable there. Assert it actually resolves.
      - name: Install the wheel into a clean environment
        run: |
          cd python
          python -m venv /tmp/clean
          /tmp/clean/bin/python -c "import importlib.util as u; assert u.find_spec('setuptools') is None, 'fresh venv unexpectedly has setuptools; test is void'"             || echo "note: this interpreter seeds setuptools into new venvs"
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'EOF'
          import importlib.util as u, sys
          have = u.find_spec("setuptools") is not None
          if sys.version_info >= (3, 12):
              assert have, "setuptools marker dependency did not resolve on 3.12"
              print("3.12: setuptools pulled in as required")
          else:
              print(f"{sys.version_info.major}.{sys.version_info.minor}: setuptools present={have} (not required)")
          EOF
