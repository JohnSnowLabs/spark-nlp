[pytest]
markers =
    fast: mark test as fast for CI.
    slow: mark test as slow; requires an explicitly selected execution lane.
    onnx: requires the ONNX inference engine.
    tensorflow: requires the TensorFlow inference engine.
    embeddings: exercises embedding generation.
    text: processes text input or output.
    resource_intensive: supplements slow for resource-intensive workloads; runner capacity must be checked.
